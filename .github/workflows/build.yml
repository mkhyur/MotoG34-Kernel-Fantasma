name: Moto G34 Kernel Debug Auto Defconfig

on:
  workflow_dispatch:

env:
  ARCH: arm64
  KERNEL_DIR: kernel

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

    - name: Checkout
      uses: actions/checkout@v4


    - name: Install dependencies
      shell: bash
      run: |
        set -Eeuo pipefail
        trap 'echo "::error file=${BASH_SOURCE[0]},line=${LINENO}::Command failed: ${BASH_COMMAND}"' ERR

        sudo apt update
        sudo apt install -y \
          bc bison flex git curl cpio unzip \
          libssl-dev libelf-dev python3


    - name: Clone Motorola SM6375 Kernel
      shell: bash
      run: |
        set -Eeuo pipefail
        trap 'echo "::error file=${BASH_SOURCE[0]},line=${LINENO}::Command failed: ${BASH_COMMAND}"' ERR

        git clone --depth=1 \
        https://github.com/Motorola-SM6375-Devs/android_kernel_motorola_sm6375.git kernel


    - name: Install KernelSU Next 3.3.0
      working-directory: kernel
      shell: bash
      run: |
        set -Eeuo pipefail
        trap 'echo "::error file=${BASH_SOURCE[0]},line=${LINENO}::Command failed: ${BASH_COMMAND}"' ERR

        curl -LSs \
        https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh \
        | bash -s v3.3.0


    - name: Detect defconfig
      working-directory: kernel
      shell: bash
      run: |
        set -Eeuo pipefail

        echo "===== DEFCONFIGS DISPONIVEIS ====="
        find arch/arm64/configs -type f | sort

        DEFCONFIG=$(find arch/arm64/configs \
        -type f \
        \( -iname "*fogos*" -o -iname "*2363*" -o -iname "*sm6375*" -o -iname "*holi*" \) \
        | head -n 1)

        if [ -z "$DEFCONFIG" ]; then
          echo "::error::Não foi encontrado defconfig compatível com Moto G34 fogos"
          exit 1
        fi

        DEFCONFIG=${DEFCONFIG#arch/arm64/configs/}

        echo "Defconfig encontrado:"
        echo "$DEFCONFIG"

        echo "DEFCONFIG=$DEFCONFIG" >> $GITHUB_ENV


    - name: Configure kernel
      working-directory: kernel
      shell: bash
      run: |
        set -Eeuo pipefail
        trap 'echo "::error file=${BASH_SOURCE[0]},line=${LINENO}::Command failed: ${BASH_COMMAND}"' ERR

        echo "Usando:"
        echo "$DEFCONFIG"

        make O=out "$DEFCONFIG"


    - name: Enable KernelSU
      working-directory: kernel
      shell: bash
      run: |
        set -Eeuo pipefail
        trap 'echo "::error file=${BASH_SOURCE[0]},line=${LINENO}::Command failed: ${BASH_COMMAND}"' ERR

        echo "CONFIG_KSU=y" >> out/.config

        make O=out olddefconfig


    - name: Build Kernel
      working-directory: kernel
      shell: bash
      run: |
        set -Eeuo pipefail
        trap 'echo "::error file=${BASH_SOURCE[0]},line=${LINENO}::Command failed: ${BASH_COMMAND}"' ERR

        make O=out LLVM=1 LLVM_IAS=1 -j$(nproc)


    - name: Create AnyKernel3 ZIP
      shell: bash
      run: |
        set -Eeuo pipefail
        trap 'echo "::error file=${BASH_SOURCE[0]},line=${LINENO}::Command failed: ${BASH_COMMAND}"' ERR

        git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git

        cp kernel/out/arch/arm64/boot/Image AnyKernel3/

        cd AnyKernel3

        zip -r9 ../MotoG34_Kernel_Debug.zip .


    - name: Upload ZIP
      uses: actions/upload-artifact@v4
      with:
        name: MotoG34_Kernel_Debug
        path: MotoG34_Kernel_Debug.zip
