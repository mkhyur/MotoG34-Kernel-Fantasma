name: Moto G34 Fogos KernelSU Next Build v8

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Install build tools
      run: |
        set -Eeuo pipefail
        sudo apt update
        sudo apt install -y \
          bc bison flex git curl cpio unzip \
          libssl-dev libelf-dev python3 \
          clang llvm lld device-tree-compiler

    - name: Download kernel source
      run: |
        set -Eeuo pipefail
        git clone --depth=1 \
          https://github.com/Motorola-SM6375-Devs/android_kernel_motorola_sm6375.git kernel

    - name: Install KernelSU Next 3.3.0
      working-directory: kernel
      run: |
        set -Eeuo pipefail
        curl -LSs \
        https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh \
        | bash -s v3.3.0

    - name: Configure Moto G34 fogos
      working-directory: kernel
      run: |
        set -Eeuo pipefail
        export ARCH=arm64

        make O=out vendor/holi_qgki_defconfig || \
        make O=out gki_defconfig

        ./scripts/kconfig/merge_config.sh \
          -m \
          -O out \
          out/.config \
          arch/arm64/configs/vendor/ext_config/moto-holi-fogos.config

        scripts/config --file out/.config \
          -e ARCH_QCOM \
          -e QCOM_QMI_HELPERS \
          -e KSU \
          -e BUILD_ARM64_DT_OVERLAY \
          -d SHADOW_CALL_STACK \
          -e LTO_NONE

        yes "" | make O=out olddefconfig

    - name: Build kernel
      working-directory: kernel
      run: |
        set -Eeuo pipefail
        export ARCH=arm64

        make O=out \
          LLVM=1 \
          LLVM_IAS=1 \
          -j$(nproc)

    - name: Create flashable ZIP
      run: |
        set -Eeuo pipefail

        git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git

        cp kernel/out/arch/arm64/boot/Image AnyKernel3/

        cd AnyKernel3
        zip -r9 ../MotoG34_KernelSU_Next_Fogos.zip .

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: MotoG34_KernelSU_Next_Fogos
        path: MotoG34_KernelSU_Next_Fogos.zip
