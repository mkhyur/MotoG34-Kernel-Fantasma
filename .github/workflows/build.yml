name: Moto G34 KernelSU Next Fogos Debug v13

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4

    - name: Tools
      run: |
        sudo apt update
        sudo apt install -y bc bison flex git curl cpio unzip libssl-dev libelf-dev python3 clang llvm lld device-tree-compiler

    - name: Clone source
      run: |
        git clone --depth=1 https://github.com/Motorola-SM6375-Devs/android_kernel_motorola_sm6375.git kernel

    - name: KernelSU Next
      working-directory: kernel
      run: |
        curl -LSs https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh | bash -s v3.3.0

    - name: Patch KernelSU includes
      working-directory: kernel
      run: |
        set -Eeuo pipefail

        FILE="drivers/kernelsu/feature/sucompat.c"

        if grep -q "linux/pgtable.h" "$FILE"; then
          sed -i 's#<linux/pgtable.h>#<asm/pgtable.h>#' "$FILE"
        fi

        echo "Current includes:"
        head -20 "$FILE"

    - name: Configure
      working-directory: kernel
      run: |
        set -Eeuo pipefail
        export ARCH=arm64

        make O=out gki_defconfig

        ./scripts/kconfig/merge_config.sh \
          -m -O out out/.config \
          arch/arm64/configs/vendor/ext_config/moto-holi-fogos.config

        scripts/config --file out/.config \
          -e KSU \
          -e ARCH_QCOM \
          -e QCOM_QMI_HELPERS \
          -e BUILD_ARM64_DT_OVERLAY

        make O=out olddefconfig

    - name: Build debug
      working-directory: kernel
      run: |
        set -Eeuo pipefail
        export ARCH=arm64
        set +e
        make O=out LLVM=1 LLVM_IAS=1 V=1 -j$(nproc) 2>&1 | tee build.log
        RESULT=${PIPESTATUS[0]}
        set -e

        if [ "$RESULT" != "0" ]; then
          grep -nEi "error:|fatal error|undefined reference|failed|No such file" build.log || true
          tail -200 build.log
          exit $RESULT
        fi

    - name: Upload log
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-error-log
        path: kernel/build.log
