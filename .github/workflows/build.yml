name: Moto G34 Kernel Debug Build

on:
  workflow_dispatch:

env:
  ARCH: arm64

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

    - name: Checkout
      uses: actions/checkout@v4


    - name: Install dependencies
      shell: bash
      run: |
        set -Eeuo pipefail
        trap 'echo "::error file=${BASH_SOURCE[0]},line=${LINENO}::Command failed: ${BASH_COMMAND}"' ERR

        sudo apt update
        sudo apt install -y \
          bc bison flex git curl cpio unzip \
          libssl-dev libelf-dev python3


    - name: Clone kernel source
      shell: bash
      run: |
        set -Eeuo pipefail
        trap 'echo "::error file=${BASH_SOURCE[0]},line=${LINENO}::Command failed: ${BASH_COMMAND}"' ERR

        git clone --depth=1 \
        https://github.com/Motorola-SM6375-Devs/android_kernel_motorola_sm6375.git kernel


    - name: Install KernelSU Next
      working-directory: kernel
      shell: bash
      run: |
        set -Eeuo pipefail
        trap 'echo "::error file=${BASH_SOURCE[0]},line=${LINENO}::Command failed: ${BASH_COMMAND}"' ERR

        curl -LSs \
        https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh \
        | bash -s v3.3.0


    - name: Apply patches
      shell: bash
      run: |
        set -Eeuo pipefail
        trap 'echo "::error file=${BASH_SOURCE[0]},line=${LINENO}::Command failed: ${BASH_COMMAND}"' ERR

        if [ ! -d patches ]; then
          echo "::error::Folder patches not found"
          exit 1
        fi

        cp -rv patches/* kernel/


    - name: Configure kernel
      working-directory: kernel
      shell: bash
      run: |
        set -Eeuo pipefail
        trap 'echo "::error file=${BASH_SOURCE[0]},line=${LINENO}::Command failed: ${BASH_COMMAND}"' ERR

        echo "Procurando defconfig..."

        if make O=out fogos_defconfig; then
          echo "Usando fogos_defconfig"
        elif make O=out sm6375_defconfig; then
          echo "Usando sm6375_defconfig"
        else
          echo "::error::Nenhum defconfig do Moto G34 encontrado"
          find arch -name "*defconfig" | grep -i moto || true
          exit 1
        fi


    - name: Build kernel
      working-directory: kernel
      shell: bash
      run: |
        set -Eeuo pipefail
        trap 'echo "::error file=${BASH_SOURCE[0]},line=${LINENO}::Command failed: ${BASH_COMMAND}"' ERR

        make O=out olddefconfig

        make O=out \
        LLVM=1 \
        LLVM_IAS=1 \
        -j$(nproc)


    - name: Generate flashable ZIP
      shell: bash
      run: |
        set -Eeuo pipefail
        trap 'echo "::error file=${BASH_SOURCE[0]},line=${LINENO}::Command failed: ${BASH_COMMAND}"' ERR

        git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git

        cp kernel/out/arch/arm64/boot/Image AnyKernel3/

        cd AnyKernel3
        zip -r9 ../MotoG34_Kernel_Debug.zip .


    - name: Upload result
      uses: actions/upload-artifact@v4
      with:
        name: MotoG34_Kernel_Debug
        path: MotoG34_Kernel_Debug.zip
