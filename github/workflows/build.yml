name: Build Moto G34 Fantasma KernelSU SUSFS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Dependencies
        run: |
          sudo apt update
          sudo apt install -y bc bison flex libssl-dev libelf-dev git curl cpio unzip python3

      - name: Clone Motorola SM6375 kernel
        run: |
          git clone --depth=1 https://github.com/Motorola-SM6375-Devs/android_kernel_motorola_sm6375.git kernel

      - name: KernelSU Next 3.3.0
        working-directory: kernel
        run: |
          curl -LSs https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh | bash -s v3.3.0

      - name: Apply Fantasma patch
        run: |
          cp patches/include/linux/fantasma.h kernel/include/linux/
          cp patches/fs/proc/fantasma.c kernel/fs/proc/

      - name: Enable config
        working-directory: kernel
        run: |
          export ARCH=arm64
          make O=out fogos_defconfig || make O=out sm6375_defconfig
          echo "CONFIG_KSU=y" >> out/.config
          make O=out olddefconfig

      - name: Compile
        working-directory: kernel
        run: |
          export ARCH=arm64
          make O=out LLVM=1 LLVM_IAS=1 -j$(nproc)

      - name: Create flashable ZIP
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git
          cp kernel/out/arch/arm64/boot/Image AnyKernel3/
          cd AnyKernel3
          zip -r9 ../MotoG34_Fantasma_KSU_SUSFS.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: MotoG34_Fantasma_KSU_SUSFS
          path: MotoG34_Fantasma_KSU_SUSFS.zip
